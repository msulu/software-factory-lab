<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Software Factory — ready to run.">
    <title>Software Factory</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23172234'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='bold' fill='white'%3ESF%3C/text%3E%3C/svg%3E">
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #f1f5f9;
        color: #172234;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: 100%;
        max-width: 34rem;
        padding: clamp(1.5rem, 6vw, 3.5rem);
        text-align: center;
        background: #fff;
        border: 1px solid #dce3ec;
        border-top: 4px solid #2563eb;
        border-radius: 1rem;
        box-shadow: 0 16px 48px #1722340a;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3rem);
        line-height: 1.15;
        letter-spacing: -0.04em;
      }
      p { margin: 1.25rem 0 2rem; color: #475569; font-size: 1.125rem; line-height: 1.5; }
      #order-count { margin: 1.5rem 0 0; }
      button {
        min-height: 3rem;
        max-width: 100%;
        padding: 0.875rem 1.75rem;
        border: 0;
        border-radius: 0.5rem;
        background: #1d4ed8;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #1e40af; }
      button:active { background: #172f85; }
      button:focus-visible { outline: 3px solid #2563eb; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Software Factory</h1>
      <p id="status" role="status" aria-live="polite">Factory is running</p>
      <button id="run-factory" type="button">Run Factory</button>
      <p id="order-count" role="status" aria-live="polite">Orders processed: 0</p>
    </main>
    <script>
      let ordersProcessed = 0;
      document.getElementById('run-factory').addEventListener('click', () => {
        ordersProcessed += 1;
        document.getElementById('status').textContent = 'Order received!';
        document.getElementById('order-count').textContent = `Orders processed: ${ordersProcessed}`;
      });
    </script>
  </body>
</html>
