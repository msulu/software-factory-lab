name: Website CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-site:
    name: Validate static website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check website
        run: python3 scripts/check_site.py
